<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!--
      `favicon.ico`, not a PNG of the mark.

      A tab draws the icon at 16 px. Handing the browser an 800 px symbol and
      letting it downscale gives a smudge; the `.ico` carries 16, 32 and 48 px
      renders resampled separately, so each size is drawn rather than squeezed.
      It is also the file browsers, feed readers and link previewers request
      from the site root whether or not this tag exists, which is why it lives
      at `/favicon.ico` and not under `/brand/`.

      All three sizes come from the brand mark rather than from the app icon.
      The app icon is the orange held in a hand, and at 16 px the hand is a
      smudge under the fruit; the tab gets the mark on its own, which is the
      same drawing legible at a sixteenth the size. The *installed application*
      icon is `brand/app-icon-*.png` — see the manifest — and
      `scripts/content/build_app_icons.py` renders both from the same command,
      so neither can drift without the other being rebuilt.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <!--
      No `maximum-scale` and no `user-scalable=no`.

      Both were here, and both disable pinch zoom — which is a WCAG 2.1 AA
      failure (1.4.4 Resize Text) and, more to the point, takes away the one
      thing a learner with low vision does when the Korean is too small to make
      out. That is a strange thing for a handwriting app to prevent. They were
      there to stop iOS zooming when a text field is focused; the app has two
      text inputs, both at 16px, which is the size at which iOS does not zoom.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF6700" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      A square, opaque render. iOS ignores the aspect ratio of whatever it is
      given and squashes it into a rounded square, so handing it the source
      artwork — which is taller than it is wide, with transparency around it —
      put a stretched orange on a black tile.
    -->
    <link rel="apple-touch-icon" sizes="192x192" href="/brand/app-icon-192.png" />
    <!--
      What a crawler and a link preview get, before any JavaScript runs

      Everything between here and the end of the head is the *pre-hydration*
      answer. A
      social crawler — Slack, KakaoTalk, Discord, X, Facebook — fetches this
      file, reads the tags, and leaves. It does not run React, so anything
      `ui/DocumentMetadata` sets afterwards is for the person in the tab, not
      for the card in the chat. Both have to be right, and they are set in two
      different places for that reason.

      English here, because English is the default locale and a crawler has no
      learner to have a preference. `LocaleProvider` rewrites `lang`, `dir`,
      the title and the description as soon as the app resolves the language.
    -->

    <!--
      Not indexed, and that is deliberate

      This product is a paid application, not a content site. The URL is meant
      to be *shared* — a link in a message should open the app and should show
      a preview card — and it is not meant to rank for "learn Korean". There
      is nothing here for a search result to usefully point at, and a
      half-indexed SPA competing with its own store listing is worse than
      nothing.

      `noindex` is the authoritative mechanism and it has to be *readable* to
      be obeyed: a URL disallowed in robots.txt can still surface as a bare
      link, precisely because the crawler was never allowed to fetch the page
      and find this tag. So there is no robots.txt disallow and no sitemap;
      there is this tag, and the matching `X-Robots-Tag` header in
      `vercel.json` for the fetches that never parse HTML at all.

      `nofollow` and friends are here for completeness. None of them affects
      Open Graph: the crawlers that build preview cards are not search
      crawlers, do not consult robots meta, and are unaffected by every
      directive on these two lines.
    -->
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />

    <!--
      The description, and why it is two sentences

      It has to say what the product is to somebody who has never heard of it,
      in the width a preview card gives before it truncates — about 160
      characters on most surfaces. So: what you start from, what you get, and
      the one mechanic worth naming. No architecture, no "no account, no
      server", no adjectives about quality.
    -->
    <meta
      name="description"
      content="Start Korean from zero. Learn Hangul step by step, build practical vocabulary, and review what you're likely to forget."
    />

    <!-- Open Graph. Absolute URLs: a crawler resolves nothing relative. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hangyul Ganada" />
    <meta property="og:url" content="https://ganada.talkhangyul.com/" />
    <meta property="og:title" content="Hangyul Ganada — Learn Hangul &amp; Korean Vocabulary" />
    <meta
      property="og:description"
      content="Start Korean from zero. Learn Hangul step by step, build practical vocabulary, and review what you're likely to forget."
    />
    <!--
      The brand key visual, resampled to 1200x600 by
      `scripts/content/build_app_icons.py` from
      `apps/common_assets/ob/hangyul_ganada_ob_image.png` — the canonical
      social-share artwork. The source is 3200x1600 — exactly the 2:1
      `summary_large_image` asks for — so it is a straight resample with no
      crop and nothing drawn over it. The width, height and type below are
      asserted against the generated file by `npm run share:check`.
    -->
    <meta property="og:image" content="https://ganada.talkhangyul.com/brand/og-hangyul-ganada.png" />
    <meta property="og:image:secure_url" content="https://ganada.talkhangyul.com/brand/og-hangyul-ganada.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="600" />
    <meta
      property="og:image:alt"
      content="Hangyul Ganada — the app's home screen on a phone, beside the words: When life gives you a tangerine, Talk Hangyul."
    />
    <meta property="og:locale" content="en" />

    <!-- X / Twitter reads its own namespace and falls back to og: for the rest. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hangyul Ganada — Learn Hangul &amp; Korean Vocabulary" />
    <meta
      name="twitter:description"
      content="Start Korean from zero. Learn Hangul step by step, build practical vocabulary, and review what you're likely to forget."
    />
    <meta name="twitter:image" content="https://ganada.talkhangyul.com/brand/og-hangyul-ganada.png" />
    <meta
      name="twitter:image:alt"
      content="Hangyul Ganada — the app's home screen on a phone, beside the words: When life gives you a tangerine, Talk Hangyul."
    />

    <link rel="canonical" href="https://ganada.talkhangyul.com/" />
    <title>Hangyul Ganada — Learn Hangul &amp; Korean Vocabulary</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
